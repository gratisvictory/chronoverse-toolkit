name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version bump type (major, minor, patch) or exact version'
                required: false
                type: string
            first-release:
                description: 'Is this the first release?'
                required: false
                type: boolean
                default: false
            dry-run:
                description: 'Dry run (no actual release)'
                required: false
                type: boolean
                default: false

permissions:
    contents: write
    pull-requests: write
    actions: read

env:
    NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
    check-ci:
        name: Check CI Status
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        steps:
            - name: Wait for CI to complete
              uses: lewagon/wait-on-check-action@v1.4.1
              with:
                  ref: ${{ github.ref }}
                  check-name: 'CI OK'
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  wait-interval: 10

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: [check-ci]
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: ./.github/actions/ci-setup

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Print Environment Info
              run: yarn nx report

            - name: Build packages
              run: yarn nx run-many -t build --all --parallel=3

            - name: Release (First Release)
              if: ${{ inputs.first-release && !inputs.dry-run }}
              run: yarn nx release --first-release --skip-publish ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release (First Release - Dry Run)
              if: ${{ inputs.first-release && inputs.dry-run }}
              run: yarn nx release --first-release --skip-publish --dry-run ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release (Normal)
              if: ${{ !inputs.first-release && !inputs.dry-run }}
              run: yarn nx release --skip-publish ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release (Normal - Dry Run)
              if: ${{ !inputs.first-release && inputs.dry-run }}
              run: yarn nx release --skip-publish --dry-run ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Push tags to trigger publish workflow
              if: ${{ !inputs.dry-run }}
              run: |
                  echo "Pushing tags to remote repository..."
                  git push --follow-tags

                  echo "Listing created tags..."
                  git tag --list '@chronoverse-*'
