name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version bump type (major, minor, patch) or exact version'
                required: false
                type: string
            first-release:
                description: 'Is this the first release?'
                required: false
                type: boolean
                default: false
            dry-run:
                description: 'Dry run (no actual release)'
                required: false
                type: boolean
                default: false

permissions:
    contents: write
    pull-requests: write
    actions: read
    id-token: write

jobs:
    check-ci:
        name: Check CI Status
        runs-on: ubuntu-latest
        steps:
            - name: Wait for CI to complete
              uses: lewagon/wait-on-check-action@v1.4.1
              with:
                  ref: ${{ github.ref }}
                  check-name: 'CI OK'
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  wait-interval: 10

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: [check-ci]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: ./.github/actions/ci-setup

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Build packages
              run: yarn build
              shell: bash

            - name: Release (First Release)
              if: ${{ inputs.first-release && !inputs.dry-run }}
              run: yarn nx release --first-release --skip-publish ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release (First Release - Dry Run)
              if: ${{ inputs.first-release && inputs.dry-run }}
              run: yarn nx release --first-release --skip-publish --dry-run ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release (Normal)
              if: ${{ !inputs.first-release && !inputs.dry-run }}
              run: yarn nx release --skip-publish ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release (Normal - Dry Run)
              if: ${{ !inputs.first-release && inputs.dry-run }}
              run: yarn nx release --skip-publish --dry-run ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Push tags to trigger publish workflow
              if: ${{ !inputs.dry-run }}
              run: |
                  echo "Pushing tags to remote repository..."
                  git push --follow-tags

                  echo "Listing created tags..."
                  git tag --list '@chronoverse-*'
              shell: bash

            - name: Wait for OTP Secret
              if: ${{ !inputs.dry-run }}
              id: wait-for-secrets
              uses: step-security/wait-for-secrets@v1
              with:
                  secrets: |
                      OTP:
                        name: 'npm OTP'
                        description: 'Enter your npm one-time password for publishing'

            - name: Publish packages to npm
              if: ${{ !inputs.dry-run }}
              run: yarn nx release publish
              shell: bash
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
                  NPM_CONFIG_OTP: ${{ steps.wait-for-secrets.outputs.OTP }}
