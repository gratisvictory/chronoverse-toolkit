name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version bump type (major, minor, patch) or exact version'
                required: false
                type: string
            first-release:
                description: 'Is this the first release?'
                required: false
                type: boolean
                default: false
            dry-run:
                description: 'Dry run (no actual release)'
                required: false
                type: boolean
                default: false

permissions:
    contents: write
    pull-requests: write
    actions: read

jobs:
    check-ci:
        name: Check CI Status
        runs-on: ubuntu-latest
        steps:
            - name: Wait for CI to complete
              uses: lewagon/wait-on-check-action@v1.4.1
              with:
                  ref: ${{ github.ref }}
                  check-name: 'CI OK'
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  wait-interval: 10

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: [check-ci]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: ./.github/actions/ci-setup

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Build packages
              run: yarn build
              shell: bash

            - name: Release (First Release)
              if: ${{ inputs.first-release }}
              run: |
                  if [ "${{ inputs.dry-run }}" = "true" ]; then
                    yarn nx release --first-release --yes --dry-run ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
                  else
                    yarn nx release --first-release --yes ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
                  fi
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release (Normal)
              if: ${{ !inputs.first-release }}
              run: |
                  if [ "${{ inputs.dry-run }}" = "true" ]; then
                    yarn nx release --skip-publish --dry-run ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
                  else
                    yarn nx release --skip-publish ${{ inputs.version && format('--specifier={0}', inputs.version) || '' }}
                  fi
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
